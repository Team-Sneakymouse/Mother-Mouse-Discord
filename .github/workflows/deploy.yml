# prettier-ignore
name: Docker Image CI

permissions:
  contents: "read"
  id-token: "write"

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Check out source code 
      - name: Fetch registry credentials from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: lords-of-minecraft
          env-slug: prod
          secret-path: /Registry
      - name: Log in to registry
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | docker login $REGISTRY_HOST \
            --username "$REGISTRY_USER" \
            --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        run: |
          docker buildx build \
            --tag "$REGISTRY_HOST/mother-mouse-discord:latest" \
            --push \
            .
      - name: Fetch Watchtower secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: lords-of-minecraft
          env-slug: prod
          secret-path: /Watchtower
      - name: Trigger Watchtower # Trigger Watchtower to update the running container
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $WATCHTOWER_TOKEN" \
            "$WATCHTOWER_URL"
